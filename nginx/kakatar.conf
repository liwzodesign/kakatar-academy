# Nginx : sert le frontend (SPA) et relaie l'API / l'admin vers Django
server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|admin|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ { alias /var/www/static/; expires 30d; }
    location /media/  { alias /var/www/media/;  expires 7d; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Routes React (BrowserRouter)
    location / { try_files $uri /index.html; }
}
