user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2G;   # téléversement de vidéos

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # HTTPS : terminer TLS ici (certbot) ou devant (Cloudflare, load balancer),
        # puis activer SECURE_SSL_REDIRECT côté Django.

        location /api/v1/auth/login/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Métriques Prometheus : non exposées publiquement
        location = /metrics {
            return 404;
        }

        location ~ ^/(api|graphql|admin|health)(/|$) {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
            proxy_request_buffering off;
        }

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Fichiers privés : servis uniquement via l'API (contrôle d'accès)
        location ~ ^/media/(verification|marketplace/files|marketplace/deliveries|assignments|lessons/videos|lessons/hls)/ {
            return 404;
        }

        # Vidéos des leçons : accessibles uniquement après autorisation par Django (X-Accel-Redirect)
        location /protected-media/ {
            internal;
            alias /var/www/media/;
            add_header Cache-Control "private, max-age=3600";
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
            access_log off;
        }

        # Service worker et manifeste : jamais mis en cache par le navigateur (mises à jour immédiates)
        location ~ ^/(sw\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Application React (routes gérées côté client)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / {
            try_files $uri /index.html;
        }
    }
}
