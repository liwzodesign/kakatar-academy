version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: kakatar_postgres
    environment:
      POSTGRES_DB: kakatar_academy
      POSTGRES_USER: kakatar_user
      POSTGRES_PASSWORD: kakatar_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - kakatar_network
    restart: unless-stopped

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: kakatar_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kakatar_network
    restart: unless-stopped

  # Elasticsearch pour la recherche
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kakatar_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - kakatar_network
    restart: unless-stopped

  # Backend Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakatar_backend
    environment:
      - DEBUG=False
      - DB_HOST=postgres
      - DB_NAME=kakatar_academy
      - DB_USER=kakatar_user
      - DB_PASSWORD=kakatar_password
      - REDIS_URL=redis://redis:6379/1
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - elasticsearch
    networks:
      - kakatar_network
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              gunicorn kakatar_academy.wsgi:application --bind 0.0.0.0:8000"

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kakatar_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
      - REACT_APP_GRAPHQL_URL=http://localhost:8000/graphql
    depends_on:
      - backend
    networks:
      - kakatar_network
    restart: unless-stopped

  # Nginx pour le reverse proxy
  nginx:
    image: nginx:alpine
    container_name: kakatar_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - kakatar_network
    restart: unless-stopped

  # Celery pour les tâches asynchrones
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakatar_celery
    command: celery -A kakatar_academy worker -l info
    environment:
      - DB_HOST=postgres
      - DB_NAME=kakatar_academy
      - DB_USER=kakatar_user
      - DB_PASSWORD=kakatar_password
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - kakatar_network
    restart: unless-stopped

  # Celery Beat pour les tâches planifiées
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakatar_celery_beat
    command: celery -A kakatar_academy beat -l info
    environment:
      - DB_HOST=postgres
      - DB_NAME=kakatar_academy
      - DB_USER=kakatar_user
      - DB_PASSWORD=kakatar_password
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - kakatar_network
    restart: unless-stopped

  # Flower pour monitorer Celery
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakatar_flower
    command: celery -A kakatar_academy flower --port=5555
    environment:
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery
    networks:
      - kakatar_network
    restart: unless-stopped

  # Prometheus pour le monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: kakatar_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - kakatar_network
    restart: unless-stopped

  # Grafana pour la visualisation
  grafana:
    image: grafana/grafana:latest
    container_name: kakatar_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - kakatar_network
    restart: unless-stopped

  # MailHog pour les emails de développement
  mailhog:
    image: mailhog/mailhog:latest
    container_name: kakatar_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Interface web
    networks:
      - kakatar_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:

networks:
  kakatar_network:
    driver: bridge 