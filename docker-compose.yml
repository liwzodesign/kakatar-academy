# Kakatar Academy — pile complète.
#   cp .env.example .env   (puis renseigner les secrets)
#   docker compose up -d --build
#   docker compose --profile monitoring up -d   (Prometheus + Grafana + Flower)
#   docker compose --profile dev up -d          (MailHog pour voir les emails)

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-kakatar}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@postgres:5432/${POSTGRES_DB:-kakatar_academy}
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/2
    CELERY_RESULT_BACKEND: redis://redis:6379/3
    CELERY_TASK_ALWAYS_EAGER: "False"
    MEDIA_X_ACCEL: "True"
  volumes:
    - media_volume:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  networks: [kakatar_network]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kakatar_academy}
      POSTGRES_USER: ${POSTGRES_USER:-kakatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kakatar} -d ${POSTGRES_DB:-kakatar_academy}"]
      interval: 5s
      retries: 10
    networks: [kakatar_network]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [kakatar_network]
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kakatar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kakatar_academy}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      CELERY_TASK_ALWAYS_EAGER: "False"
      MEDIA_X_ACCEL: "True"
      RUN_MIGRATIONS: "1"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles

  celery:
    <<: *backend
    command: celery -A kakatar_academy worker -l info --concurrency 2
    healthcheck:
      disable: true

  celery-beat:
    <<: *backend
    command: celery -A kakatar_academy beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
    networks: [kakatar_network]
    restart: unless-stopped

  # --- Monitoring (profil « monitoring ») ---
  flower:
    <<: *backend
    command: celery -A kakatar_academy flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-change-me}
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:5555:5555"
    profiles: [monitoring]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [kakatar_network]
    profiles: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [kakatar_network]
    profiles: [monitoring]
    restart: unless-stopped

  # --- Développement (profil « dev ») : boîte mail locale ---
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
    networks: [kakatar_network]
    profiles: [dev]

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:

networks:
  kakatar_network:
