<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#2563eb;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:bold;">🎓 {{ site_name }}</td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          <p>Bonjour {{ user.first_name|default:user.email }},</p>
          {% block content %}{% endblock %}
          <p style="margin-top:28px;">L'équipe {{ site_name }}</p>
        </td></tr>
        <tr><td style="padding:16px 28px;background:#f9fafb;color:#6b7280;font-size:12px;">
          Vous recevez cet email car vous avez un compte sur {{ site_name }}.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
