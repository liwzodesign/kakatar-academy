<!doctype html>
<html lang="fr">
<head>

  <meta name="theme-color" content="#263682" />
  <title>Hors connexion · Kakatar Academy</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;

    img { width: 96px; }
    h1 { font-size: 22px; margin: 24px 0 8px; color: #192253; }

             font-weight: 600; cursor: pointer; }

</head>
<body>
  <main>
    <img src="/logo-mark.svg" alt="Kakatar Academy" />
    <h1>Vous êtes hors connexion</h1>
    <p>Vérifiez votre connexion internet. Vos notes et votre progression sont conservées : vous reprendrez là où vous en étiez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
